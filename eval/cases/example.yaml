# Starter case. It passes against the scaffold, so `pnpm eval` is green from
# minute one and you can see the harness working before writing real cases.
#
# Replace these with cases for the actual challenge. Required coverage, per
# /ai-evaluation: correctness, grounding, hallucination, tool selection,
# prompt injection, refusal/escalation, and language (kk/ru/en).

- description: "App reports healthy and offline - a judge can run this with no API key"
  assert:
    - type: javascript
      value: "output.status === 'ok'"
    - type: javascript
      value: "output.model.offline === true"

